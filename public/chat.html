<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SAARTHI – Chatbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="img/saarthi-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.1" />
</head>

<body class="dashboard-body chat-page-body">

  <main class="dashboard-main chatgpt-main">
    <div class="chat-layout-wrapper">
      <aside class="chat-sidebar" id="chatSidebar">
        <div class="sidebar-header-row">
          <div class="sidebar-logo-area">
            <img src="img/saarthi-logo.png" alt="SAARTHI" class="sidebar-logo-img" />
            <span class="sidebar-header-title">SAARTHI AI</span>
          </div>
          <button id="closeSidebarBtn" class="close-sidebar-btn" title="Close Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>
        <button id="newChatBtn" class="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span id="newChatBtnText">New chat</span>
        </button>
        <div class="chat-search-container">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="chatSearchInput" placeholder="Search chats..." />
          <button id="clearSearchBtn" class="clear-search-btn hidden">✕</button>
        </div>

        <div class="chat-history-list" id="chatHistoryList">
          <!-- Previous chats will render here -->
        </div>

        <!-- Profile Menu relocated to bottom of sidebar to match ChatGPT UI -->
        <div class="sidebar-footer">
          <div id="profileMenu" class="profile-menu">
            <button id="profileButton" class="profile-button">
              <span id="profileInitials" class="profile-avatar">F</span>
              <span id="profilePhoneShort" class="profile-phone">+91‑</span>
              <span class="profile-caret">▾</span>
            </button>
            <div id="profileDropdown" class="profile-dropdown hidden">
              <button id="profileBackDashboard" class="profile-dropdown-item">
                Back to dashboard
              </button>
              <button id="profileLogoutBtn" class="profile-dropdown-item">
                Logout
              </button>
            </div>
          </div>
        </div>
      </aside>

      <section class="chat-ui-container">
        <div class="chat-ui-header">
          <div class="header-left">
            <button id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Toggle sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </button>
            
            <!-- Static Header Title -->
            <div class="chat-header-title-container">
              <span class="chat-header-title-text" id="chatUiTitle">SAARTHI AI</span>
              <span class="chat-header-version-badge">v1.0</span>
            </div>
          </div>
          
          <div class="header-right">
            <!-- Minimal Dashboard Home Icon link -->
            <a href="dashboard.html" class="minimal-nav-btn" title="Return to Dashboard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span class="btn-text">Dashboard</span>
            </a>
          </div>
        </div>

        <div class="chat-ui-messages" id="chatWindow">
          <!-- AI Messages will populate here -->
        </div>
        <div class="chat-ui-input-area">
          <div id="imagePreviewContainer" class="image-preview-container hidden">
            <img id="chatImagePreview" src="" alt="Image Preview" />
            <button id="removeImageBtn" class="remove-image-btn" title="Remove image">✕</button>
          </div>
          <div class="chat-input-wrapper">
            <input type="file" id="chatImageInput" accept="image/*" class="hidden-file-input" />
            <button id="attachBtn" class="chat-attach-btn" title="Attach image">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                </path>
              </svg>
            </button>
            <textarea id="chatInput" placeholder="Message SAARTHI AI..." rows="1"></textarea>
            <button id="chatSendBtn" class="chat-send-btn" title="Send message">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <div id="chatDisclaimer" class="chat-disclaimer">
            SAARTHI AI can make mistakes. Please verify critical farming recommendations contextually.
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Custom Popup Modal -->
  <div id="customPopup" class="custom-popup-modal hidden">
    <div class="custom-popup-content">
      <h3 id="popupTitle">Confirm Action</h3>
      <p id="popupMessage">Are you sure you want to proceed?</p>
      <div class="custom-popup-actions">
        <button id="popupCancelBtn" class="popup-btn cancel">Cancel</button>
        <button id="popupConfirmBtn" class="popup-btn confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>

</html>
