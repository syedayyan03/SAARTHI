<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SAARTHI – Disease Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="img/saarthi-logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2ebd66" />
  <link rel="stylesheet" href="css/styles.css?v=1.8" />
</head>

<body class="dashboard-body">
  <header class="top-bar">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="dashboard.html" class="back-circle-btn" aria-label="Go back to Dashboard">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <a href="dashboard.html" class="logo-link">
        <div class="logo-area">
          <img src="img/saarthi-logo.png" alt="SAARTHI – AI Based Crop Recommendation" class="logo-img" />
          <div>
            <div class="logo-title">SAARTHI</div>
            <div id="dashLogoSubtitle" class="logo-subtitle">Disease Detection</div>
          </div>
        </div>
      </a>
    </div>
    <div class="top-right">
            <div id="profileMenu" class="profile-menu">
        <button id="profileButton" class="profile-button">
          <span id="profileInitials" class="profile-avatar">F</span>
          <span id="profilePhoneShort" class="profile-phone">+91‑</span>
          <span class="profile-caret">▾</span>
        </button>
        <div id="profileDropdown" class="profile-dropdown hidden">
          <button id="profileBackDashboard" class="profile-dropdown-item">
            Back to dashboard
          </button>
          <button id="profileLogoutBtn" class="profile-dropdown-item">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="centered-content-wrapper">
      <section class="dashboard-header">
        <div>
          <h1 id="diseasePageTitle">Disease Detection</h1>
          <p id="diseasePageIntro" class="muted">
            Upload a crop or leaf photo below. Our built-in Gemini AI model will analyze your
            photo in real-time to detect possible diseases and offer reliable advice.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="upload-container-wrapper">
          <div id="dropZone" class="upload-dropzone">
            <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 0.5rem;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p id="uploadInstruction" class="upload-instruction">Drag & Drop leaf photo here or <span class="browse-link" style="color: var(--primary-dark); font-weight: 700; text-decoration: underline;">browse files</span></p>
            <p id="uploadSubtext" class="upload-subtext">Supports PNG, JPG, JPEG files</p>
            <input id="diseaseFile" type="file" accept="image/png, image/jpeg, image/jpg" style="display: none;" />
          </div>
          <div id="imagePreviewContainer" class="image-preview-container hidden">
            <img id="imagePreview" src="" alt="Selected Leaf Preview" />
            <button id="removeImageBtn" class="btn-remove-image" type="button">&times;</button>
          </div>
          <div class="action-btn-container" style="margin-top: 1.5rem; text-align: center;">
            <button id="detectDiseaseBtn" class="btn btn-primary btn-block" style="width: 100%; max-width: 300px; padding: 0.8rem 2rem; font-weight: 600; font-size: 1rem; border-radius: 30px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2); transition: all 0.25s ease;" disabled>
              Detect Disease
            </button>
          </div>
        </div>
        <div id="diseaseResult" class="disease-result"></div>
      </section>
    </div>
  </main>

  <script src="js/disease.js?v=1.4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
